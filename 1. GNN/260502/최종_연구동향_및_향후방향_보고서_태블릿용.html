# 알루미늄 휠 충격 응력 예측 GNN 연구 동향 및 향후 방향 보고서

**작성일**: 2026년 5월 4일
**대상 논문**: Developing of an Geometry-aware AI model for Predicting Stress Distribution in Aluminum Wheels under Impact (JSAE 2026, Changgon Kim et al.)
**작성 목적**: 본 논문을 발전시키기 위한 최신 연구 동향 분석 및 중장기 연구 로드맵 제안

---

## Executive Summary

본 보고서는 현대자동차 김창곤 책임연구원이 제1저자로 참여한 JSAE 2026 투고 논문 *"Developing of an Geometry-aware AI model for Predicting Stress Distribution in Aluminum Wheels under Impact"* 를 출발점으로, 본 논문이 다음 1~3년 내에 어떻게 발전되어야 하는가에 대한 학술·산업적 근거를 종합한다.

**본 논문의 핵심 기여**: MeshGraphNets [Pfaff et al., 2021] 백본을 기반으로, (1) 응력 집중 영역에 가중치를 부여한 modified L₂ loss와 (2) Impact zone과 Non-impact zone 사이에 무작위 엣지를 추가하는 geometry-aware edge augmentation 두 기법을 결합하여, 양산 사양 알루미늄 휠(노드 200~400k)의 13도 동적 충격 응력 분포를 Top-20% 영역에서 MAPE 7.0%, KLD 0.005로 예측한다. 이는 선행 연구 [Jin·Zheng·Kim·Gu, APL 2023]의 단순 형상(노드 3~5k) 기반 R² 0.965 결과를 양산 스케일과 동적 해석으로 확장한 것이다.

**조사 범위**: GNN 및 mesh-based simulation 핵심 기술 동향 30건(2023~2026, scout-gnn-mesh)과 자동차·구조해석 AI surrogate 응용 동향 30건(scout-domain-app), 총 60건의 학술·산업 reference를 5축(데이터·모델·기법·응용·평가) 분석 프레임워크에 적용하였다.

**핵심 발견**:

1. **본 논문이 채택한 단일 해상도 flat MGN(N=20 layers) 구조는 2026년 시점에서 이미 SOTA 대비 격차가 존재한다.** X-MeshGraphNet [Nabian et al., 2024], BSMS-GNN [Cao et al., 2023], Multiscale-AMR [Perera·Agrawal, 2024] 등 거의 모든 후속작이 multi-scale 구조로 이동하였다.
2. **본 논문의 random edge augmentation은 도메인 지식 기반 spatial rewiring의 일종으로 학술적으로 정당한 기법이지만**, 2024~2025년에 등장한 spectral sparsification, JDR, Ricci curvature 기반 정량 기준 [Tortorella·Micheli, 2024; ICML 2025]과의 ablation 비교가 부재하다.
3. **시계열(temporal rollout)은 2024~2026년 가장 빠르게 표준화된 차원**이다. ReGUNet [Li·Zhao·Pfaff et al., 2025], GNSS [Bayraktar et al., 2025], NVIDIA Crash Dynamics ML [Nabian et al., 2025]이 대표 사례이며, 본 논문의 단일 max-stress 시점 예측은 동적 충격의 본질적 가치(잔류응력, 피로해석)를 누락한다.
4. **불확실성 정량화(UQ)는 비교 가능한 7건 모두 미적용이며**, 양산 안전 부품 적용의 결정적 장벽이다. FEMIN-VBF [Thel et al., 2024]가 동일 motivation으로 검증되었으나 휠 도메인은 first-mover 가능 영역이다.
5. **Foundation model 시대 진입**으로 580 샘플 from-scratch 학습의 비효율이 심화되었다. Poseidon [Herde et al., NeurIPS 2024], SGUNET [Shen et al., Apple 2025]은 1/16~1/50 데이터로 동등 성능을 달성하며, 본 논문의 "GPU 자원 한계" 문제에 직접적 해법을 제공한다.
6. **본 논문의 양산 데이터(85 휠, 580 샘플, 200~400k 노드, dynamic impact)는 산업 surrogate 표준 대비 작지 않으며**, 충격 분야 공개 벤치마크가 부재하므로 selective 공개 시 standard benchmark 후보 가치가 크다.
7. **Hyundai-NVIDIA AI Factory 50K GPU 협력(2025)** 및 **JSAE + Japan Deep Learning Association 학술 환경**은 본 논문 발전의 외부 enabling factor로 작용한다.

**최우선 추천 연구 방향 Top 3**:

- **D1. SOTA Baseline ablation + 데이터 확장 + Foundation Model Fine-tuning** (단기, 6~12개월): Transolver·BSMS-GNN·SGUNET를 본 논문 데이터에 적용하여 현재 contribution의 학술적 위치를 정립하고, Hyundai 사내 미사용 데이터 +500 샘플을 추가하여 Top-20% MAPE를 **7.0% → 5.0% 이하**로 끌어내린다.
- **D2. 시계열 GNN 확장** (중기, 12~24개월): ReGUNet 또는 NVIDIA의 transient strategy 3종(time-conditional, autoregressive, stability-enhanced AR rollout)을 본 데이터에 적용하여 t=0~10ms 시계열 응력 예측을 가능케 한다.
- **D3. UQ + Bayesian GNN 도입** (중기, 12~24개월): MC Dropout → Variational Bayesian MGN → Conformal prediction 단계적 도입으로 ECE ≤0.05를 달성하여 양산 hybrid 운영(NN + FE fallback)의 근거를 마련한다.

**단기 예상 성과**: 6~12개월 내 D1 완수 시 Top-20% MAPE 5.0% 이하, 가속 ratio ≥100× 정량화, ISO 3006 합격/불합격 분류 정확도 ≥90% 달성이 기술적으로 가능하며, 이는 본 논문이 명시한 "초기 설계 단계 활용"을 실증 단계로 전환시킨다.

## 1장. 서론

### 1.1 연구 배경

자동차 휠은 차량 안전과 직결된 1차 부품으로, 13도 충격 시험은 KMVSS·ISO 3006 등 양산 인증 절차에 포함된 표준 강도 평가 항목이다. 현행 휠 개발 프로세스는 양산 전 다수의 형상 후보에 대해 유한요소(FE) 기반 동적 충격 해석을 반복 수행하는 방식으로, 단일 해석에 수 시간~수십 시간이 소요되며 이는 신차 라인업 다양화에 따른 형상 변형 폭 확대와 맞물려 개발 사이클의 주된 병목이 되고 있다. 본 논문 §1에서 저자들은 이 한계를 정확히 지적하면서 AI/ML 기반 surrogate model의 도입 필요성을 제기하였다.

선행 연구의 데이터 표현 방식은 점진적으로 발전해 왔다 (본 논문 Fig. 2 참조). 2D 이미지 기반 [Kim et al., 2020]은 강성·충격강도 예측에 실패하였고, 3D voxel 기반 [Kim et al., 2021]은 geometric detail이 부족하였다. 이에 본 연구진의 선행 작업 [Jin·Zheng·Kim·Gu, APL 2023]은 mesh를 graph로 변환하는 GNN 접근을 도입하여 단순 휠 형상에서 von Mises stress R² = 0.965를 달성하였다. 본 논문은 이를 양산 사양 휠(노드 200~400k)과 dynamic impact 데이터로 확장한 후속 연구이다.

본 논문은 학계 대부분이 단순 형상 또는 정적 해석에 머무르는 가운데 **양산 geometry × dynamic impact**라는 industrial-grade 시나리오에서 작동하는 GNN surrogate를 보고하였다는 점에서 학술·산업 양면에서 의의가 크다. 그러나 GNN/mesh-based simulation 분야는 2024~2026년 사이에 multi-scale 구조, attention/transformer 결합, SE(3)-equivariance, foundation model pretraining, physics-informed loss 등의 방향으로 빠르게 발전하고 있어, 본 논문이 채택한 단일 해상도 flat MGN + heuristic edge augmentation 방식은 SOTA와 일정한 격차를 보이고 있다. 본 보고서는 이 격차를 정량·정성 분석하고, 본 논문의 강점을 살리면서 현재 동향을 흡수하는 1~3년 단위 발전 로드맵을 제안한다.

본 논문의 기여를 정량 수치 중심으로 정리하면 다음과 같다.

| 평가 — R² (Top 100%) | 0.712 ± 0.001 (Edge + Data Aug) |
| 가속 효과 | 정성 언급 ("FE 대비 계산 시간 대폭 단축"), 정량 ratio 미보고 |

본 논문이 §4 결론에서 명시한 향후 계획은 (1) GPU 자원 한계로 미사용된 데이터의 점진적 추가 학습, (2) chassis 부품(suspension arm 등)으로 framework 확장, (3) 시계열 GNN으로 충격 전체 과정 추적, (4) 실험 데이터 활용한 신뢰성 향상이다. 본 보고서의 5장 로드맵은 이 4개 항목을 출발점으로 하되, 2024~2026년 학술 동향이 추가로 시사하는 방향을 통합한다.

## 2장. GNN 및 Neural Operator 최신 연구 동향

### 2.1 MeshGraphNets 이후의 GNN 아키텍처 발전

MeshGraphNets [Pfaff et al., ICLR 2021]는 mesh-based physics simulation 분야의 사실상 표준 백본으로 자리잡았으며, 본 논문 또한 이를 채택하였다. 그러나 2023년 이후 후속 연구는 두 갈래로 발전하였다. 첫째는 멀티스케일·계층 구조로 large mesh의 long-range 정보 전달 한계를 해결하는 흐름이며, 둘째는 attention/transformer를 결합하여 깊은 메시지 패싱(message passing) 없이 글로벌 정보를 캡처하는 흐름이다.

**첫 번째 흐름 (멀티스케일/계층 구조)**: NVIDIA가 2024년 발표한 X-MeshGraphNet [Nabian et al., arXiv:2411.17164]은 큰 그래프를 partition + halo region으로 분할하여 partition 간 message passing을 보장하며, CAD STL에서 직접 point cloud + k-NN graph를 생성하여 추론 시 mesh가 불필요하다. 본 논문이 양산 휠 200~400k 노드를 처리할 때 직면하는 scalability 한계의 표준 해법으로, NVIDIA PhysicsNeMo에 통합되어 산업 적용 가능성도 확보되었다. Bi-Stride Multi-Scale GNN(BSMS-GNN) [Cao et al., ICML 2023]은 BFS frontier를 격간으로 pooling하여 coarse mesh를 자동 생성하는데, MGN 대비 inference 2.8배 가속과 메모리 절반 감소를 보고하였다. Multiscale GNNs with Adaptive Mesh Refinement [Perera·Agrawal, CMAME 2024, arXiv:2402.08863]은 전통적 multigrid solver를 모방하여 transformer 기반 메시지 패싱 GNN으로 downsampling을 수행하며 phase-field fracture에 적용한 점에서 본 논문의 응력 집중 시나리오와 가장 가까운 응용으로 평가된다. 2025년에 등장한 M4GN [arXiv:2509.10659]은 mesh를 multi-segment로 분할하면서 자동 분할까지 학습하는 점에서, 본 논문의 "spoke 영역만 사용" 전략을 자동화하는 발전 방향을 제시한다.

**두 번째 흐름 (attention/transformer 결합)**: Pfaff 그룹 추정으로 2026년 발표된 MeshGraphNet-Transformer [arXiv:2601.23177]는 Physics-attention Transformer를 global processor로 사용하여 모든 노드 상태를 동시에 업데이트한다. 깊은 MP stack이나 hierarchical coarsening 없이도 long-range 정보를 직접 캡처할 수 있다. Garnier 외 [arXiv:2508.18051, 2025]가 보고한 "Training Transformers for Mesh-Based Simulations"는 인접 행렬을 attention mask로 활용하면서 Dilated Sliding Window + Global Attention으로 receptive field를 확장하였다.

본 논문이 N=20 layers에서 한계에 도달했다는 Table 2의 관찰(Trial 1 vs 2 비교)은 over-smoothing의 임박 신호로 해석할 수 있으며, 이는 위 두 흐름 중 하나의 도입을 직접적으로 정당화한다. 본 논문 후속 연구의 백본 비교 ablation은 수개월 내 수행 가능한 quick win이다.

### 2.2 Neural Operator의 부상 (FNO, DeepONet, GINO)

Neural Operator는 무한차원 함수 공간 사이의 사상을 학습하는 frame work로, FNO(Fourier Neural Operator)가 대표적이다. 그러나 FNO는 regular grid를 가정하므로 자동차 표면과 같은 비정형 3D mesh에 직접 적용할 수 없다는 한계가 있었다. 이를 해결한 대표 연구가 GINO(Geometry-Informed Neural Operator) [Li et al., NeurIPS 2023, arXiv:2309.00583]이다. GINO는 Signed Distance Function(SDF)으로 형상을 표현한 뒤 Graph Neural Operator(GNO)로 비정형 grid를 regular latent grid로 변환하고 FNO를 적용하는 3단 구조를 제안하였으며, 차량 표면 압력 예측에서 500개 데이터로 학습하여 GPU CFD 대비 26,000배 가속을 보고하였다. GINOT(Geometry-Informed Neural Operator Transformer) [CMAME 2025]는 SDF 같은 추가 geometric feature 없이 unordered surface point cloud만으로 임의 형상의 PDE 해를 예측한다.

본 논문의 mesh 기반 접근과 GINO의 SDF 기반 접근은 형상 표현 측면에서 상호 배타적이라기보다 보완적이다. 본 논문이 PPT/ODB에서 mesh를 추출하는 자동화 파이프라인을 GINOT 방식으로 단순화할 가능성이 있으나, 응력 분포 같은 volumetric 양에는 적용 한계가 있어 별도 ablation이 필요하다.

Foundation model 측면에서는 Poseidon [Herde et al., NeurIPS 2024, arXiv:2405.19101]이 multiscale operator transformer 기반 PDE foundation model로, 시간 조건부 layer norm으로 continuous-in-time 평가를 지원한다. 15개 downstream task에서 FNO가 1024 샘플로 도달하는 오차를 **단 20 샘플**만으로 달성한 결과는, 본 논문이 명시한 "small data 580 샘플 + GPU 자원 한계" 문제에 가장 직접적인 해법을 제공한다. Universal Physics Transformers(UPT) [Alkin et al., NeurIPS 2024, arXiv:2402.12365]는 Lagrangian과 Eulerian을 모두 처리하는 통합 transformer로, 본 논문이 향후 시계열 GNN으로 발전 시 직접 적용 가능한 백본이다. Sequential DeepONet(S-DeepONet) [He et al., Acta Mechanica 2024, arXiv:2306.03645]은 GRU(branch) + FNN(trunk) 조합으로 시간 의존 입력에서 vector solution field를 예측하며, 본 논문의 "max stress 시점만 사용 → 시계열 GNN으로 확장" 계획과 정합한다.

### 2.3 Equivariant GNN과 Physics-aware 기법

물리 시뮬레이션에서 좌표계 회전·평행이동 불변성(SE(3)-equivariance)은 데이터 효율 측면에서 결정적 장점을 갖는다. 휠 충격 시나리오는 P_A, θ₀~θ₈ 등 여러 충격 방향이 존재하며, 본 논문은 이를 random edge augmentation 및 데이터 증강(약 50% 비율)으로 처리하였다. 그러나 EGNO(Equivariant Graph Neural Operator) [Xu et al., ICML 2024, arXiv:2401.11037]는 SE(3) equivariance를 유지하면서 Fourier space에서 temporal convolution을 수행하며, 다음 step만이 아닌 전체 trajectory를 동시 모델링한다. 입자 시뮬레이션·인체 모션 캡처·분자 동역학에서 SOTA를 달성하였다. 휠 도메인에서 EGNO를 도입하면 50% 데이터 증강 비율을 0%로 줄일 수 있다는 점이 주목된다. EquiformerV2/V3 [Liao et al., ICLR 2024 / arXiv:2604.09130]는 SE(3)-equivariant graph attention transformer의 3세대로, 분자/원자 위주이지만 transferrable한 구조이다.

물리 정합성 측면에서는 PhyMPGN(Physics-encoded Message Passing Graph Network) [Zeng et al., ICLR 2025, arXiv:2410.01337]이 GNN을 numerical integrator 안에 넣어 spatiotemporal PDE를 irregular mesh에서 풀이한다. Learnable Laplace block으로 discrete Laplace–Beltrami operator를 인코딩하여 물리적으로 타당한 solution space로 안내하며, **small training dataset에 강함**을 명시적으로 보고하였다. 본 논문 580 샘플 학습에서 핵심 인용 가치가 있는 모델이다. Dynami-CAL GraphNet [Nature Communications 2025]은 linear/angular momentum을 hard constraint로 보존하며, 동적 충격 해석이 본질적으로 momentum 보존 문제임을 고려할 때 시계열 확장 시 필수 reference이다. Finite-PINN [Li et al., 2024, arXiv:2412.09453]은 기존 PINN의 무한 영역 가정 한계를 극복하며 sparse observation에서 full-field 복원이 가능하다는 점에서, 본 논문이 "PPT의 max stress + ODB의 full distribution"을 사용하는 데이터 구조와 부합한다. FEM-PINN [Struct Multidiscip Optim 2026, DOI:10.1007/s00158-026-04257-2]은 GNN으로 mesh feature를 처리하면서 PINN loss와 FEM solver를 결합하여 car frame, car roof, **wheel hub**에서 99.37~99.63% 정확도를 보고하였다. 본 연구와 가장 가까운 도메인의 직접 응용 사례이다.

### 2.4 Long-range 정보 전달 문제와 Graph Rewiring

GNN의 long-range 정보 전달 문제는 oversmoothing과 oversquashing의 두 양상으로 잘 알려져 있다. 본 논문의 "Impact zone과 Non-impact zone 사이 random edge 추가" 기법은 이 문제에 대한 도메인 지식 기반 spatial rewiring으로 해석할 수 있으나, 2024~2025년에 등장한 정량 기준 연구와의 비교가 부재하다.

Tortorella·Micheli [arXiv:2411.17429, 2024]의 survey "Rewiring Techniques to Mitigate Oversquashing and Oversmoothing in GNNs"는 이 분야를 Geometric(Ricci curvature 기반), Spectral, Spatial, Hybrid 4개로 분류하며 bottleneck 식별 기반 edge 추가/삭제 기법을 정리하였다. 본 논문의 random edge augmentation은 Spatial 분류에 해당하며, 이 survey를 인용함으로써 본 연구의 contribution이 학술 분류 체계 안에 정확히 위치하게 된다.

ICML 2025의 "Mitigating Over-Squashing in GNNs by Spectrum-Preserving Sparsification" [Linkerhägner 추정]은 spectral graph sparsification으로 oversquashing을 완화하며, JDR(Joint Denoising-Rewiring)은 노드 feature 디노이징과 그래프 rewiring을 동시에 수행하여 spectral alignment를 최대화한다. 본 논문의 random rewiring이 unprincipled하다는 비판이 있을 수 있는데, 이 spectral 기법은 정량 비교 baseline을 제공한다. arXiv:2603.26140 [2026]은 oversmoothing/oversquashing 동시 최적화가 NP-hard임을 증명하여, rewiring 휴리스틱의 이론적 한계를 제시하였다 — 역설적으로 본 논문의 random heuristic이 학술적으로 합리화되는 근거가 된다.

EAGLE [Janny et al., ICLR 2023, arXiv:2302.10803]은 110만 mesh 규모의 turbulent fluid 데이터셋과 함께 mesh transformer가 node clustering + graph pooling + global attention으로 long-range를 캡처함을 보였다. 본 논문 dataset 규모(580)의 약 1,900배로, 향후 데이터 추가 수집 시 EAGLE급 mesh transformer 도입 시점의 reference로 활용된다. CoED(Continuous Edge Direction) GNN [arXiv:2410.14109, 2024]은 undirected mesh edge에 continuous한 fuzzy direction을 부여하고 complex-valued Laplacian으로 양방향 흐름을 동시 모델링하여 long-range 정보 전달을 강화한다. 본 논문이 random edge로 양방향 connection을 만드는 한편, CoED는 학습 가능한 방향성을 부여하므로 "impact zone에서 non-impact zone으로의 정보 흐름이 더 강하다"는 도메인 사실을 자연스럽게 학습할 수 있는 발전형이다.

### 2.5 소규모 데이터 학습과 Transfer Learning

본 논문이 직면한 580 샘플 + GPU 자원 한계는 2024~2025년 학계가 정확히 동일한 문제로 인식한 시나리오이다. SGUNET(Scalable Graph U-Net) [Shen et al., Apple 2025, arXiv:2502.06848]은 Depth-First Search pooling 기반 Graph U-Net으로, pretrained 모델과 target 아키텍처 사이의 parameter mapping function과 consistency regularization을 결합하였다. ABC dataset 20,000 시뮬레이션을 사전학습한 뒤 **1/16 데이터로 fine-tune 시 RMSE 11.05% 개선**을 보고하였다. 본 논문의 점진적 학습 계획에 SGUNET의 parameter mapping을 직접 채택할 수 있다.

Microstructure-based GNN for Multiscale Simulations [Storm et al., CMAME 2024, arXiv:2402.13101]은 미세구조 strain field만 GNN으로 예측하고 stress는 micromechanical constitutive model로 계산하는 hybrid 접근으로, 다양한 mesh에 학습하여 unseen microstructure에 일반화하면서 최대 8,300배 가속을 보고하였다. Polycrystal subgraph training [Zhai et al., Comp Mech 2025, arXiv:2409.05169]은 mesh 일부만 학습하는 전략으로 30개 unseen polycrystal에서 R² = 0.992를 달성하였다. 본 논문이 spoke 영역만 사용하는 것이 사실상 subgraph training의 일종임에도 학술적 정당화·ablation이 부족하므로, 이 두 연구는 후속 논문에서 인용 가치가 크다.

Multifidelity GNN [Taghizadeh et al., CACAIE 2025, DOI:10.1111/mice.13312]은 low-fidelity와 high-fidelity 데이터를 함께 학습하며 stress concentration around hole에 적용되었다. 본 논문이 선행 연구 [Jin·Zheng·Kim·Gu 2023]의 static 데이터를 보유하나 미활용하는 상황에서, static을 low-fidelity로 사용하는 multifidelity 학습은 직접 적용 가능하다. PI-MGNs(Physics-Informed MeshGraphNets) [CMAME 2024, DOI:10.1016/j.cma.2024.117350]은 MGN에 PDE residual loss를 통합하여 non-stationary, nonlinear PDE를 처리하며, 본 논문의 modified L₂ loss를 PDE-aware loss로 확장하는 자연스러운 발전 방향이다.

요약하면, 본 논문 580 샘플은 2026년 시점에서 from-scratch 학습보다 (1) Foundation model fine-tuning, (2) Multifidelity 학습, (3) PDE residual loss 결합 중 하나 이상을 도입하는 것이 학술·산업 양면에서 효율적이다.

## 3장. 자동차·구조해석 AI Surrogate 응용 동향

### 3.1 충격/동적 시뮬레이션 Surrogate 현황

자동차 충격(crash) 시뮬레이션 surrogate는 2024~2025년 사이에 PoC 단계에서 양산 직전 단계로 빠르게 이동하였다. NVIDIA가 2025년 발표한 "Automotive Crash Dynamics Modeling Accelerated with Machine Learning" [Nabian et al., arXiv:2510.15201]은 PhysicsNeMo 프레임워크에서 **MeshGraphNet과 Transolver를 동등 옵션으로 비교**하면서 3가지 transient 전략(time-conditional, autoregressive, stability-enhanced AR with rollout-based training)을 제시하였다. FE 정확도에는 미달하지만 수 자릿수 가속을 달성하여 초기 설계 탐색에 적합함을 보였다. 본 논문이 동일 백본(MeshGraphNets)과 동일 응용(impact)을 가지고 있으므로 이 연구는 본 논문 시계열 확장의 가장 직접적인 reference가 된다.

ReGUNet(Recurrent Graph U-Net) [Li·Zhao·Zhou·Pfaff·Li, 2025, arXiv:2503.17386]는 MeshGraphNets 저자 Pfaff가 공저로 들어간 후속 작업으로, Graph U-Net에 Recurrence를 결합하였다. B-pillar 측면 충돌 케이스에서 maximum intrusion 0.74% 오차, 베이스라인 대비 deformation 예측 오차 51% 감소를 보고하였다. 시계열 충격 surrogate의 SOTA로 평가되며, 본 논문의 단일 시점 → 시계열 확장 시 가장 가까운 reference 모델이다. 다만 메쉬 다운/업샘플링 시 spoke 영역 비대칭 처리가 필요하다는 점이 본 논문 적용 시 고려사항이다.

Multi-Hierarchical GNN [Pavone·Manjunatha·Pollet et al., Computational Mechanics 2024, arXiv:2402.09234]은 coarse 그래프에서 latent dynamics를 학습한 뒤 finer 해상도로 단계별 residual을 학습하는 구조로 LS-DYNA 시뮬레이션 데이터에 검증되었다. FEMIN(FEM Integrated Networks) [Thel·Greve·Karle·Lienkamp, CMAME 2024]은 TUM 그룹이 개발한 솔버 내부 NN 통합 기법으로, LS-DYNA 솔버 내부의 mesh 일부 영역을 NN(TgMLP+LSTM)이 대체한다. f-FEMIN(force) / k-FEMIN(kinematics) 두 접근을 제시하였으며, 부분 영역 대체로 8,550배 가속을 보고하였다. DLR Institute of Vehicle Concepts는 Neural Concept과 협력하여 Geodesic CNN 기반 surrogate(NCS)로 crash box 거동을 예측하고 full optimization loop를 돌려 Pareto front 위에서 양 목표 모두 10% 개선을 보고하였다 [Neural Concept Blog, 2024]. 이는 surrogate를 단순 예측에 머무르지 않고 최적화 루프에 투입한 좋은 사례로, 본 논문의 "초기 설계 단계 활용" 비전을 실증한 형태이다.

### 3.2 차량 부품 강도 AI 예측 사례

본 논문의 직접 선행 연구로 평가되는 Wheel Impact Test by Deep Learning [Ko et al., Struct Multidisc Optim 2022, arXiv:2210.01126]은 2D disk-view 이미지 + 3D voxel + barrier mass를 입력으로 maximum von Mises stress의 크기와 위치만을 예측하였다(분포 X). 본 논문은 이를 (i) 분포 전체 예측, (ii) 양산 형상, (iii) dynamic 해석으로 발전시킨 것이 차별점이다.

휠 도메인 직접 응용으로는 FEM-PINN for Wheel Hub [Struct Multidisc Optim 2026, DOI:10.1007/s00158-026-04257-2]가 GNN으로 mesh feature를 처리하고 PINN loss와 FEM solver를 결합하여 wheel hub 성능 예측에 99.37~99.63% 정확도를 보고하였다. 본 논문에 PINN 항(PDE residual loss)을 추가할 때 직접 비교 대상이다. Bionic Honeycomb Wheel Hub [Wang et al., Biomimetics 2024]는 FEA + Response Surface Optimization으로 응력 8.7% 감소, 무게 12.13% 감소, fatigue cycle 4.217×10⁵을 예측한 사례로, 딥러닝 기반은 아니지만 휠 도메인 표준 metric(MPa·cycle)을 사용하므로 비교 baseline으로 활용 가능하다. Aluminum Alloy Wheel Geometry Optimization [J Mater Sci Mater Eng 2026]은 ISO 3006 충격 시험 기반 spoke·hub 응력을 각각 18.7%, 22.4% 감소시켰으며, Gaussian Process Regression으로 hours→seconds 가속을 달성하였다. 본 논문이 GNN 기반인 한편, 이는 GPR baseline과의 직접 비교가 가능한 동일 표준(ISO 3006) 사례이다.

Battery Pack Frontal Impact Safety [Pan·Jin et al., J Energy Storage 2024; WEVJ 2025]는 SVM·GPR·NN을 비교하여 NN이 최고 정확도를 보였으며 평균절대오차가 in-domain 0.34% vs out-domain 2.54%로 보고되었다. 이는 본 논문의 "설계 도메인 내/외 일반화 평가" 방법론에 직접 참고가 되며, OOD 평가에서 정확도가 약 7배 악화될 수 있음을 경고한다. Automotive Steel Fatigue MLP [Zaltariov, arXiv:2501.11154, 2025]는 QSTE340TM steel에 대해 3-75-1 MLP로 MAPE 0.02~4.59%로 crack length를 예측한 사례이다.

### 3.3 FEM-AI Hybrid 접근의 실용화

FEM-AI hybrid는 NN과 FEM solver의 통합 방식에 따라 (i) FEM-loss를 NN 학습에 결합하는 형태와 (ii) solver 내부에 NN을 직접 통합하는 형태로 구분된다. (i)의 baseline은 FEM Method-enhanced NN [Meethal et al., AMSES 2023, arXiv:2205.08321]으로, FEM-based loss를 ANN 학습에 결합하여 데이터 효율과 물리 일관성을 동시에 달성하였다. (ii)의 대표는 위에서 소개한 FEMIN [Thel et al., CMAME 2024]이다.

본 논문 적용 관점에서 가장 주목할 연구는 FEMIN with Variational Bayes Filter [Thel et al., arXiv:2409.17758, 2024]이다. 이는 FEMIN 예측에 불확실성 정량화(UQ)를 추가하여 안전 critical 영역에서 NN 신뢰도가 낮으면 FEM으로 fallback하는 hybrid 운영을 가능하게 한다. 휠 충격 같은 안전 critical 도메인에서 UQ는 양산 적용 필수 요건이며, 본 논문이 first-mover로 진입할 수 있는 영역이다. 산업 응용 사례로는 SAE 2025-01-8241 "AI-Enhanced CAE Simulations" (Altair physicsAI)가 내구성·강성 예측에서 CAE 시간 30% 단축을 보고하였고, SAE 2025-01-8719 "Highly Accurate ML Models for Auto Crash"는 CAE-centric AI/ML 플랫폼으로 양산 적용 가능 수준의 정확도를 보고하였다.

### 3.4 설계 최적화 연계 동향

Surrogate를 단순 예측이 아닌 design loop의 핵심 component로 활용하는 사례가 빠르게 증가하고 있다. RL-based Topology Optimization [Lee et al., PMC 2025]은 PPO 강화학습 + 토폴로지 최적화로 무게 40% 감소를 달성하면서 SIMP/level-set 방법을 능가하였다. surrogate가 빠르면 RL 환경의 reward로 사용 가능한 사례이다. SAE 2025-01-8619 "Application of ML on Automotive Subframe Design" [Yang·Sarkaria·Kumaraswamy et al.]는 과거 subframe 프로젝트 데이터를 활용해 사용자가 입력한 raw concept을 자동으로 redesign하면서 제조성과 성능을 동시에 향상시킨다. EV 도래로 단축된 개발 사이클에 대응한 양산 직전 사례로, 본 논문 framework를 suspension/chassis로 확장하는 향후 계획에 직접 부합한다.

OEM 협업 사례로는 Mubea가 Neural Concept과 협력하여 EV battery housing 설계에 AI surrogate를 적용한 양산 사례 [Neural Concept, 2024]가 있으며, Subaru는 forming 해석 가속에서 개발 시간 75% 단축, 시뮬레이션 10배 가속을 보고하였다 [Neural Concept Connect, 2024]. 이러한 사례는 surrogate가 충분히 빠르면 양산 개발 사이클 자체를 재정의할 수 있음을 보여준다.

### 3.5 시계열 동적 응답 Surrogate

GNSS(Graph Network-based Structural Simulator) [Bayraktar et al., arXiv:2510.25683, 2025]는 3가지 inference 모드(One-Step / Rollout & Calibration / Pure Rollout)를 비교하여 Pure rollout이 가장 어렵다는 점을 정량 확인하였다. 본 논문이 향후 시계열로 확장할 때 베이스라인 비교 모델이다. RUGNN(Recurrent U-Net Graph NN) [Adv Eng Inform 2025]은 다중 forming timestep에서 deformation field를 정확히 예측하며, ReGUNet과 유사한 구조로 구조해석 도메인에 적용된 사례이다. BSMS-GNN [Cao et al., ICML 2023]은 가장 작은 학습 비용 + 가장 빠른 inference에서도 안정적 long-term rollout을 달성하여 본 논문의 message passing 효율 개선 후보이다. Multi-Hierarchical Surrogate Learning for Crash [arXiv:2402.09234]는 vehicle crash dynamics를 graph convolution으로 학습하면서 multiple hierarchical surrogate가 다른 mesh resolution에서 residual을 학습하는 구조이며, 자동차 crash dynamics 도메인 직접 일치 사례이다.

### 3.6 산업 적용 현황 (현대자동차 관련 포함)

본 논문의 산업적 맥락은 Hyundai-NVIDIA AI Factory Partnership(2025) [NVIDIA Investor Press Release]을 빼놓고 논할 수 없다. 양사는 NVIDIA Blackwell GPU 50,000개 규모의 AI Factory를 구축하면서 NVIDIA Omniverse + 자체 AI 모델로 공장·엔지니어링·모빌리티 전반을 최적화하는 협력을 발표하였으며, 2030년까지 1,100억 달러 투자 규모이다. 이는 본 논문이 명시한 "GPU 자원 한계로 미사용 데이터" 문제 해결의 청신호이다. Hyundai Motor Group은 2024년 Software-Defined Factory + Software-Defined Vehicle 비전을 발표하면서 HMGICS Singapore + Unity Digital Twin 협력, AIRS Company(2019~) 운영 등 AI 도입에 우호적인 사내 환경을 구축하였다.

JSAE Automotive Engineering Exposition + Japan Deep Learning Association 협력 [JSAE 2025-2026]은 일본 OEM의 딥러닝 도입이 학회 차원에서 표준화되었음을 시사한다. 본 논문이 JSAE에 제출된 맥락 또한 일본 OEM이 동일한 문제(고비용 CAE → 딥러닝 surrogate)에 직면해 있음을 보여준다. 상용 플랫폼 측면에서는 Neural Concept이 2025년 12월 1억 달러 Series funding을 Goldman Sachs로부터 유치하면서 Airbus·LS Electric·Mubea·Subaru·LG·GE·Safran·Mitsubishi Chemical 등 60개 이상의 OEM이 채택하였고 1,000배 빠른 예측을 보고하였다 [TheAIInsider, 2025]. NVH 영역에서는 SAE 2025-01-0123이 ANN으로 stator 재료 특성(copper winding, varnish, orthotropic laminate)을 식별하여 FRF 6 kHz 영역까지 ML로 매칭한 결과를 보고하였다. Toyota는 유럽 공장 Digital Twin으로 supply chain·생산 라인·재고를 실시간 시뮬레이션하는 양산 적용을 진행 중이다 [S&P Global, 2025].

요약하면, 자동차 OEM의 AI surrogate 적용은 "PoC → 양산" 직전 단계에 있으며, 양산 의사결정에 직접 투입된 사례는 드물고 대부분 "초기 설계 탐색·DOE 가속" 단계에 있다. 본 논문의 7% MAPE는 양산 직접 사용보다 이 단계에 적합하며, 이는 약점이 아니라 현 시점의 산업 표준에 부합한다.

### 4.3 주요 경쟁 연구와의 비교 매트릭스

본 논문과 직접 비교 가능한 7건의 연구를 5축 차원에서 정량 비교한다. 각 연구는 본 논문이 (i) 학술적으로 위치 짓기 위해, (ii) 산업적으로 차별화하기 위해, (iii) 후속 연구 reference로 삼기 위해 반드시 비교해야 할 대상이다.

**표 4-3. 비교 매트릭스 (본 논문 vs 7건)**

**핵심 관찰**:

1. **Equivariance와 UQ는 7건 모두 미적용**이다. 휠 충격 도메인에서 두 기법 중 하나라도 도입하면 본 논문은 first-mover로서 차별화된다. 특히 UQ는 양산 안전 critical 적용의 결정적 차별화 요소이다.
2. **본 논문은 dynamic + production-grade + Top-N% metric의 3중 조합이 유일**하다. 이 조합을 살리면서 약점 (multi-scale, 시계열, UQ)을 보완하는 전략이 필요하다.
3. **시계열 확장이 가장 명확한 다음 단계**이다. ReGUNet과 NVIDIA Crash Dynamics 모두 동일 방향이며, Hyundai 산업 데이터로 추격 가능하다.
4. **Foundation model fine-tuning은 580 샘플 한계의 직접 해결**이다. SGUNET 또는 Poseidon 채택 시 RMSE 10%대 추가 개선이 기대된다.

### 4.4 우선순위 갭 Top 3

Impact(영향)와 Feasibility(실행 가능성) 두 축으로 평가한 우선순위 갭은 다음과 같다.

**갭 #1 — 시계열 dynamics 부재 (Temporal Gap, P1)**

본 논문은 max-stress 시점 1 frame만 예측하므로 동적 충격의 본질인 시간 의존 거동(barrier 접촉 → impulse → wave propagation → max stress → unloading)을 단일 시점으로 reduce한다. Impact는 (i) fatigue 분석, residual stress, impact toughness 평가 불가, (ii) ISO 3006 인증이 시간 이력 기반이므로 인증 보조 불가, (iii) 거의 모든 2024-2026 후속작이 시계열 — 미적용 시 1년 내 학술적 deprecation 위험으로 모두 상이다. Feasibility는 (i) ReGUNet 직접 적용 가능, (ii) NVIDIA PhysicsNeMo 3 strategy 코드 공개, (iii) Hyundai 사내 ODB에 time history 이미 존재, (iv) Hyundai-NVIDIA 50K GPU 활용 가능으로 모두 상이다. **단기 6개월: 단일 시점 → t=0~10ms 시계열 예측, Top-20% MAPE 시계열 평균 ≤8%. 중기 1~2년: pure rollout long-term error ≤5%**의 정량 목표가 합리적이다.

**갭 #2 — Multi-scale 구조 부재 (Architecture Gap, P2)**

본 논문은 single-resolution mesh + flat MGN(N=20)이며, Table 2에서 N=20 vs 15 vs 10 비교 결과 N=20이 최적이나 추가 layer 효과 한계 — over-smoothing 임박 신호이다. Impact는 (i) Long-range 정보 전달(impact zone → 중심부) 효율성 직접 영향, (ii) 200~400k 노드 학습 비용에서 multi-scale로 BSMS 수준(2.8× inference, 메모리 절반) 가속 가능, (iii) over-smoothing 회피로 추가 layer 없이 정확도 향상 가능으로 상이다. Feasibility는 (i) BSMS-GNN 공개 코드 직접 적용 가능, (ii) Multiscale-AMR 응력 집중과 가장 유사한 phase-field fracture 응용, (iii) X-MGN PhysicsNeMo 통합으로 Hyundai-NVIDIA 협력 활용 가능, (iv) 다만 spoke 데이터 구조에서 multi-scale 분할 전략 신규 설계 필요로 중-상이다. **단기 6~12개월: inference 시간 50% 감소, MAPE 동등 또는 5% 추가 개선. 중기: Top-20% MAPE 7.0% → 5.0% 목표**가 합리적이다.

**갭 #3 — Uncertainty Quantification 부재 (Reliability Gap, P2)**

본 논문은 점추정만 제공하며 비교 매트릭스 7건 모두 UQ 미적용이지만 안전 critical 도메인은 UQ가 필수이다. Impact는 최상이다. (i) 양산 임계값(≤2-3%) 대비 본 논문 7% → 점추정만으로는 양산 직접 사용 불가. UQ가 있으면 "신뢰도 높은 영역만 surrogate, 낮은 영역만 FE 재계산" hybrid 운영 가능 → 양산 채택 가능성 ↑. (ii) FEMIN-VBF 동일 motivation으로 검증된 사례. (iii) 비교 매트릭스 7건 모두 미적용 → first-mover. Feasibility는 중이다. (i) MC Dropout, Deep Ensemble은 비교적 쉽게 추가 가능 (1주 이내), (ii) Variational Bayesian GNN은 학습 비용 2~5배 증가, (iii) 580 샘플로 신뢰성 있는 posterior 학습은 도전적, (iv) Calibration 평가에 56 test 샘플은 marginal — 추가 데이터 (방향 D2) 필수이다. **단기 6개월: ECE ≤0.05, "신뢰도 90%↑ 영역의 MAPE ≤5%" 보조 metric. 중기: hybrid 운영 시뮬레이션으로 안전 마진 확보**가 가능하다.

P1과 P2의 차이는 학술 publication 가치와 양산 가치의 우선순위 차이로 해석할 수 있다. 학술적으로는 P1(시계열)이 NeurIPS/ICLR 워크샵급 publication을 견인하며, 산업적으로는 P3(UQ)이 양산 hybrid 운영의 결정적 enabler이다. P2(multi-scale)는 두 효과의 교집합으로, 단기 quick win에 속한다.

## 5장. 향후 연구 방향 및 로드맵

본 장은 4장에서 도출한 우선순위 갭 Top 3을 SMART 기준(Specific, Measurable, Achievable, Relevant, Time-bound)으로 구체화한 8개 연구 방향(D1~D8)을 단기·중기·장기로 배치한다. 각 방향은 본 논문 저자(현대자동차 김창곤 책임)가 1~3년 내에 실제 수행 가능한 행동 항목으로 작성되었다.

### 5.1 단기 연구 방향 (6~12개월)

#### 방향 D1. SOTA Baseline ablation 및 학술적 포지셔닝 강화

**배경**: 본 논문이 5년 전 백본(MGN 2021)만 비교하여 2024-2026 SOTA 비교가 부재하며, random edge augmentation의 학술적 정당화에 spectral baseline 비교가 누락되었다. 후속 publication에서 reviewer가 가장 먼저 지적할 항목으로, 선제 대응이 필요하다.

**목표**: 본 논문의 MGN+Edge Aug baseline을 Transolver, BSMS-GNN, X-MeshGraphNet, Multiscale-AMR과 동일 데이터(580 샘플)에서 정량 비교한다. Random edge augmentation의 spectral baseline(JDR, spectrum-preserving sparsification) 대비 ablation을 수행한다.

**방법**: (1) Transolver(ICML 2024) GitHub 코드 fork → 본 데이터 학습, (2) BSMS-GNN(Eydcao/BSMS-GNN) 적용 — BFS pooling 휠 spoke 자연 분할, (3) Spectrum-preserving sparsification(ICML 2025) + JDR 적용 → 본 논문 random rewiring vs spectral 정량 비교, (4) Ablation 차원 — Random vs Spectral edge / Domain-aware vs random / MGN vs Transolver vs BSMS.

**성공 지표**:
- 4개 SOTA baseline + 본 논문 method의 MAPE/KLD/inference time 정량 비교 표 완성
- Domain-aware random edge가 spectral 기법 대비 동등 또는 우월 입증 (또는 어떤 시나리오에서 우월한지 명확화)
- Workshop short paper 1건 투고 (CMAME workshop, JCISE workshop, AIAA SciTech 후보)

**리소스**: 기존 580 샘플, GPU A100 1대 × 1주(각 baseline), 인력 1명 fulltime 또는 인턴 1명. 기간 6개월.

#### 방향 D2. 데이터 추가 학습 + Foundation Model Fine-tuning

**배경**: 본 논문이 §4 향후 계획 첫 항목으로 명시한 "GPU 자원 한계로 미사용 데이터" 문제. 사내 238 휠 × 745 strength dataset 중 활용한 85 휠 외 미사용분을 추가 학습한다. Hyundai-NVIDIA AI Factory 50K GPU 가용성(2025) 확보. SGUNET이 1/16 데이터로 RMSE 11.05% 개선 입증 → 본 논문 580 샘플 한계 직접 해결.

**목표**: 학습 데이터 580 → 1,000+ 샘플 확대, Top-20% MAPE 7.0% → **5.0% 이하** 달성, Fine-tuning이 from-scratch 대비 동등 성능에 도달하는 데 필요한 데이터량 정량(예: 1/8 데이터로 동등).

**방법**: (1) Hyundai 사내 ODB·PPT 추가 추출(기존 Python+Abaqus 스크립트 재사용) — target +500 샘플, (2) 데이터 정제 — 노드 수·충격 조건 다양성 유지, (3) SGUNET pretraining: ABC dataset 20,000 시뮬에서 사전학습 → Hyundai 데이터 fine-tune, (4) 또는 Poseidon backbone에서 fine-tune.

**성공 지표**:
- 학습 데이터 580 → 1,080 샘플 확대
- Top-20% MAPE ≤ **5.0%** 달성
- Fine-tuning이 from scratch 대비 1/8 데이터로 동등 입증
- JSAE 또는 SAE 후속 paper 1건 투고

**리소스**: 추가 데이터 +500 샘플, GPU A100 8대 × 2주 또는 H100 4대 × 1주, 인력 1명 fulltime + Hyundai 사내 CAE 엔지니어 협업. 기간 6~12개월.

**리스크**: 추가 데이터 추출 시간 소요, Foundation model이 solid mechanics 도메인 적합성 미확인 — Poseidon은 PDE foundation 일반, solid 특화 부족 → 위험 시 SGUNET 우선(ABC dataset이 mechanics 친화적).

#### 방향 D3. 추론 속도·산업 KPI 정량화 및 Industrial Benchmark 구축

**배경**: 본 논문이 정성 언급한 "FE 대비 계산 시간 단축"을 정량화한다. surrogate의 핵심 가치가 가속 ratio이며 Polycrystal GNN 150×, GINO 26,000×, Neural Concept 1,000×, FEMIN 8,550× 등 정량 보고가 표준이다. MAPE 7%가 ISO 3006 인증 시험 합격률과 어떻게 연결되는지 industrial KPI 연계가 필요하며, Crash impact 분야 공개 벤치마크 자체가 부재하므로 selective 공개의 학술 contribution이 크다.

**목표**: 가속 ratio 정량 보고, ISO 3006 합격/불합격 분류 정확도 정량, DOE 시나리오 가속 효과 입증, selective public mini-benchmark 공개.

**방법**: (1) 동일 휠 FE vs GNN 시간 측정(CPU·GPU 환경별, 5 휠 × 3 충격 조건), (2) ISO 3006 합격 기준과 MAPE 연계 — Hyundai 사내 합격/불합격 실제 데이터 활용 confusion matrix, (3) DOE 시나리오 — surrogate로 100 design variant 평가 → top 5만 FE 검증 → 전체 process 단축 시간 측정, (4) 보안 검토 후 mini-benchmark 정의 — 익명화된 휠 형상 + 분포 통계만 공개.

**성공 지표**:
- GNN 추론이 FE 해석 대비 **≥100× 가속** (목표 1,000×)
- ISO 3006 합격/불합격 분류 정확도 **≥90%**
- DOE 100 design 시나리오 전체 process 시간 **≥60% 단축**
- Selective public mini-benchmark 1건 공개 (또는 Hyundai 사내 benchmark 정착)

**리소스**: 기존 데이터 + Hyundai 사내 ISO 3006 합격/불합격 결과, 인력 1명 + Hyundai CAE 엔지니어 협업. 기간 9~12개월.

### 5.2 중기 연구 방향 (1~2년)

#### 방향 D4. 시계열 GNN 확장 (Temporal Rollout, P1)

**배경**: 우선순위 갭 #1 직접 대응. 동적 충격 surrogate의 본질적 가치(fatigue, residual stress, impact toughness) 회복. ReGUNet B-pillar 0.74% intrusion 오차로 feasibility 입증. 본 논문 §4 향후 계획에 명시.

**목표**: t=0~10ms (100 frame) 시계열 예측, Pure rollout MAPE Top-20% ≤ **8%** at t=peak, ≤ **12%** at t=10ms, Long-term rollout error 누적 증가율 ≤ **0.5% per ms**.

**방법**: (1) Hyundai 사내 ODB time history 전체 frame 추출, (2) ReGUNet(Graph U-Net + Recurrence) 본 데이터 적용 — spoke mesh를 temporal sequence로 변환, (3) NVIDIA의 3가지 transient strategy 비교 — time-conditional vs autoregressive vs stability-enhanced AR with rollout-based training, (4) noise injection (MGN 원논문 기법) 적용으로 long rollout 안정성 확보, (5) Dynami-CAL momentum conservation hard constraint 통합 (선택적).

**성공 지표**: 위 목표치 달성 + FE 대비 시계열 전체 해석 시간 **≥500× 가속** + NeurIPS workshop 또는 ICLR workshop 1건 투고.

**리소스**: 기존 580 샘플의 시계열 확장(각 샘플당 ~100 frame → 58,000 frame), GPU H100 4대 × 4주, 인력 1명 fulltime + 인턴 1명. 기간 12~24개월.

**리스크**: ODB 시계열 추출 비용(Hyundai 사내 disk 공간 부족 가능), Pure rollout long-term 안정성(noise injection + AR rollout training 필수), 데이터 양 추가 증가(×100) → GPU 자원 의존.

#### 방향 D5. Multi-scale GNN 도입 (Architecture, P2)

**배경**: 우선순위 갭 #2 직접 대응. 본 논문 N=20에서 한계 도달 — 추가 layer 시 over-smoothing 위험. 200~400k 노드 학습 효율 — BSMS 보고치 inference 2.8× 가속, 메모리 절반. 응력 집중 영역(spoke junction)에 fine resolution 적용으로 weighted loss 효과 강화.

**목표**: Multi-scale 구조에서 Top-20% MAPE 7.0% → **5.0% 이하**, Inference 시간 50% 감소, GPU 메모리 사용량 50% 감소(200~400k 노드 단일 GPU 학습 가능), Layer 수 증가(N=30, N=50)에서 over-smoothing 회피 입증.

**방법**: (1) BSMS-GNN BFS pooling을 spoke mesh 적용 — 자연 분할 vs 세분화 비교, (2) Multiscale-AMR(Perera·Agrawal 2024) — 응력 집중 영역에 mesh refine, 비집중 영역 coarsen, transfer learning 까지, (3) X-MeshGraphNet partition+halo — Hyundai-NVIDIA PhysicsNeMo 통합 활용, (4) M4GN 자동 segment learning 시도 (선택적, spoke 영역 자동 식별).

**성공 지표**: 위 목표치 달성 + CMAME 또는 JCISE 본 논문 발전형 1건 투고.

**리소스**: 기존 + 추가 데이터(D2 결과), GPU A100 4대 × 3주, 인력 1명 fulltime. 기간 12~24개월(D1·D4와 병행).

**리스크**: Multi-scale 분할 전략 spoke geometry 부적합 가능 — M4GN 자동 학습 보완, BSMS BFS pooling 비대칭 spoke에서 안정성 저하 가능, 코드 통합 비용.

#### 방향 D6. Uncertainty Quantification + Bayesian GNN

**배경**: 우선순위 갭 #3 직접 대응. 양산 안전 critical 도메인 필수 요건. 비교 매트릭스 7건 모두 UQ 미적용 → first-mover. FEMIN-VBF(TUM 2024) 동일 motivation 검증 사례.

**목표**: ECE ≤ **0.05**, 90% Prediction Interval Coverage **≥85%**, 신뢰도 90%↑ 영역에서 MAPE **≤3%** (양산 임계값 도달), Hybrid 운영 시 FE 재계산 비율 ≤30% (전체 시간 단축 ≥70%).

**방법**: (1) MC Dropout(T=50 sample) + Deep Ensemble(5 model) baseline 구현, (2) Variational Bayesian MGN — FEMIN-VBF 코드 참조, ELBO loss + KL regularization, (3) Conformal prediction — 580 샘플 calibration set, finite-sample coverage guarantee, (4) Hybrid(NN+FE) 시뮬레이션 — 신뢰도 90%↑ 영역만 surrogate, 그 외 FE 재계산.

**성공 지표**: 위 목표치 달성 + 안전 critical AI venue(ICRA, NeurIPS Safety workshop) 1건 투고.

**리소스**: 기존 + 추가 데이터, GPU A100 4대 × 4주, 인력 1명 fulltime + Hyundai 안전 부서 협업. 기간 12~24개월.

**리스크**: 580 샘플로 신뢰성 posterior 학습 도전 — small-data UQ는 conformal prediction 우선, Variational Bayesian 학습 비용 2~5배 — Hyundai-NVIDIA AI Factory 자원 활용, Calibration 평가에 56 test 샘플 marginal — 추가 데이터(D2) 필수.

## 6장. 결론

### 6.1 종합 평가

본 논문 *"Developing of an Geometry-aware AI model for Predicting Stress Distribution in Aluminum Wheels under Impact"*는 mesh-based GNN을 양산 사양 알루미늄 휠의 dynamic impact 응력 분포 예측에 적용한 industrial-grade 연구로, 양산 geometry(노드 200~400k) × dynamic impact × Top-N% region metric의 3중 조합이 학계에서 유일하다는 차별성을 갖는다. 두 가지 핵심 기법(modified L₂ loss로 10% 향상, geometry-aware random edge augmentation으로 추가 3% 향상)은 도메인 지식을 GNN 학습에 효과적으로 주입한 사례로 평가된다. 최종 성능 Top-20% MAPE 7.0%, KLD 0.005는 양산 안전 부품 직접 사용에는 미달하나(임계값 2~3%), 초기 설계 탐색·DOE 가속 단계의 산업 표준에 부합한다.

본 보고서는 60건의 학술·산업 reference에 대한 5축 갭 분석을 통해 다음과 같은 결론에 도달하였다.

**본 논문이 강화해야 할 차별적 강점**:
1. 양산 데이터 보유 — Hyundai-NVIDIA AI Factory와 결합 시 학계 미접근 영역
2. Dynamic impact + Top-N% metric — 동적 충격 surrogate 표준 metric 후보
3. 자동화된 데이터 추출 파이프라인 — 향후 chassis 다부품 확장의 기반
4. Hyundai-Berkeley 협업 모델 — industrial data + academic rigor 차별화
5. 본 논문 데이터(selective 공개) — 충격 분야 공개 벤치마크 부재 시 standard benchmark 후보

**본 논문이 보완해야 할 핵심 약점**:
1. Multi-scale 구조 부재 (W1) — 2024-2026 거의 모든 후속작이 이미 채택
2. 시계열 dynamics 미고려 (W2) — 동적 충격 본질의 누락
3. UQ 부재 (W3) — 양산 적용 결정적 장벽
4. Foundation model 미활용 (W4) — small-data 한계의 표준 해법 미사용
5. SOTA baseline 비교 부재 (W5, 평가 갭) — 후속 논문 reviewer 대응 필요

### 6.2 본 논문의 연구사적 위치

본 논문은 mesh-based GNN surrogate의 발전사에서 다음의 3중 위치를 차지한다.

**(1) APL 2023 → JSAE 2026 단계적 발전의 정점**: 선행 연구 [Jin·Zheng·Kim·Gu, APL 2023]가 단순 휠 형상(노드 3~5k)에서 R² 0.965를 달성한 이후, 본 논문은 이를 양산 사양(노드 200~400k) + dynamic impact로 확장하여 industrial-grade 적용 가능성을 입증하였다. 이 발전 경로는 학계 단순 형상 연구가 양산 적용으로 이행하는 표준 case study로서 가치가 있다.

**(2) MeshGraphNets 백본의 양산 응용 사례**: Pfaff 그룹의 MGN(2021) 백본이 fluid dynamics와 단순 solid에서 검증된 이후, dynamic structural impact + production geometry 조합으로 검증한 거의 유일한 사례이다. 본 논문은 MGN의 산업 적용 가능성을 입증하는 reference paper 역할을 한다.

**(3) Hyundai 사내 AI surrogate 연구의 출발점**: Kim et al. 2020(2D 이미지) → 2021(3D voxel) → APL 2023(단순 mesh) → JSAE 2026(양산 mesh + dynamic)의 4단계 발전을 통해, Hyundai Motor Group의 AI-driven CAE 비전이 학술적·기술적으로 정립된 시점이다. 향후 chassis 다부품·양산 통합으로 확장 시 본 논문은 그 출발점으로 인용될 것이다.

다만 2024-2026년 학계는 multi-scale·attention·equivariance·foundation model로 빠르게 이동하였으며, Pfaff 그룹 자체도 ReGUNet(2025)으로 시계열 후속작을 발표하였다. 본 논문이 학술적 deprecation을 회피하려면 향후 1~2년 내에 이 동향을 흡수하는 후속 publication이 필수적이며, 본 보고서가 제안하는 D1~D6은 이를 위한 구체적 행동 항목이다.

### 6.3 즉시 착수 권장 사항

본 논문 저자가 2026년 5월부터 즉시 착수해야 할 4건을 우선순위 순으로 정리한다.

1. **D1 (SOTA Baseline ablation)**: 6개월 내 완수 가능, A100 1대 × 1주 단위로 4개 baseline 비교 → 후속 publication reviewer 대응 + 학술 포지셔닝 정립.
2. **D2 (데이터 추가 + Foundation FT)**: Hyundai 사내 미사용 데이터 +500 샘플 추출과 SGUNET/Poseidon fine-tuning 병행 → Top-20% MAPE 5% 이하 달성.
3. **D3 (추론·KPI 정량화)**: surrogate의 가속 ratio 정량 보고 + ISO 3006 합격/불합격 분류 정확도 입증 → 산업 ROI 가시화.
4. **D4 시계열 데이터 추출 (선행 작업)**: 중기 D4(시계열 GNN)를 위한 ODB time history 추출 인프라 구축 — D2와 병행하여 데이터 추출 자동화 스크립트에 통합.

이 4건은 6~12개월 단일 사이클 내에 모두 완수 가능하며, JSAE/SAE/CMAME 워크샵급 publication 1~2건과 양산 ROI 보고서 1건을 산출물로 기대할 수 있다.

                    wrapper.className = 'executive-summary';
                    
                    while(nextElem && nextElem.tagName !== 'H2' && nextElem.tagName !== 'HR') {
                        const current = nextElem;
                        nextElem = nextElem.nextElementSibling;
                        wrapper.appendChild(current);
                    }
                    h2.parentNode.insertBefore(wrapper, nextElem);
                }
            });

            const scrollBtn = document.getElementById("scrollTopBtn");
            window.onscroll = function() {
                if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                    scrollBtn.style.display = "block";
                } else {
                    scrollBtn.style.display = "none";
                }
            };
            
            scrollBtn.onclick = function() {
                window.scrollTo({top: 0, behavior: 'smooth'});
            };
            
        } catch(e) {
            document.getElementById('content').innerHTML = "<p>Error parsing markdown content.</p>";
            console.error(e);
        }
    });
</script>
</body>
</html>
